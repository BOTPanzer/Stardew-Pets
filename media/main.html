<!DOCTYPE html>
<html lang="en">
    <!-- Info -->
    <head>
        <title>Stardew Pets 😸</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Preload font & menus image -->
        <link rel="preload" href="{media}fonts/StardewValley.ttf" as="font" type="font/ttf">
        <link rel="preload" href="{media}sprites/ui/menu.png" as="image" type="image/png">

        <!-- Styling & scripts -->
        <link rel="stylesheet" href="{media}main.css">
        <script type="module" src="{media}main.js"></script>
    </head>

    <!-- Content -->
    <body media="{media}" hide>
        <!-- Game -->
        <div id="background">
            <!-- Game canvas -->
            <canvas id="canvas"></canvas>
        </div>

        <!-- Decor mode -->
        <div id="decor">
            <!-- Controls -->
            <span id="decor-help">Drag to move</span>

            <!-- Toggle action & exit buttons -->
            <div class="decorButtons" onmousedown="event.stopPropagation();" onmouseup="event.stopPropagation();">
                <!-- Toggle action -->
                <div id="decor-action" class="menu" button show>
                    <span id="decor-action-name">Action</span>
                </div>

                <!-- Exit decor mode -->
                <div id="decor-exit" class="menu" button show>
                    <span>Exit</span>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages"></div>

        <!-- Menus -->
        <div id="menus" onmousedown="event.stopPropagation();" onmouseup="event.stopPropagation();">
            <!-- Actions menu -->
            <div id="actions" class="menu" onclick="event.stopPropagation();">
                <div id="actions-content" class="menuContent" scrollable>
                    <!-- Buttons -->
                    <div id="action-ball" class="menuButton">
                        <img src="{media}sprites/ui/ball.png">
                        <span>Play with Ball</span>
                    </div>
                    <div id="action-gift" class="menuButton">
                        <img src="{media}sprites/ui/gift.png">
                        <span>Give a Gift</span>
                    </div>
                    <div id="action-store" class="menuButton">
                        <img src="{media}sprites/ui/house.png">
                        <span>General Store</span>
                    </div>
                    <div id="action-decor" class="menuButton">
                        <img src="{media}sprites/ui/axe.png">
                        <span id="actionsDecor">Enter Decor Mode</span>
                    </div>
                </div>
            </div>

            <!-- Store menu -->
            <div id="store" class="menu" onclick="event.stopPropagation();">
                <div id="store-content" class="menuContent" scrollable>
                    <!-- Items -->
                </div>
            </div>

            <!-- Money menu -->
            <div id="money" class="menu" button show onclick="event.stopPropagation();">
                <span id="money-text">0G</span>
            </div>
        </div>

        <!-- Cursor -->
        <div id="cursor"></div>
    </body>
</html>
